<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="Real docker compose output: five distkv nodes running, then the leader is killed and node4 takes over while the data is still served">
  <title>A five-node cluster, and the same cluster after its leader is killed</title>
  <desc>Verbatim output from docker compose ps and distkv-cli against a real cluster.</desc>
  <defs>
    <linearGradient id="cchrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17335C"/>
      <stop offset="100%" stop-color="#102647"/>
    </linearGradient>
    <clipPath id="cwin"><rect x="8" y="8" width="924" height="454" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#cwin)">
    <rect x="8" y="8" width="924" height="454" fill="#0B1729"/>
    <rect x="8" y="8" width="924" height="44" fill="url(#cchrome)"/>
    <circle cx="34" cy="30" r="6.5" fill="#FF5F57"/>
    <circle cx="56" cy="30" r="6.5" fill="#FEBC2E"/>
    <circle cx="78" cy="30" r="6.5" fill="#28C840"/>
    <text x="470" y="35" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8FB4E3">docker compose ps — real output</text>
  </g>
  <rect x="8" y="8" width="924" height="454" rx="14" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Columns are positioned explicitly rather than padded with spaces:
       SVG collapses runs of whitespace, and xml:space is honoured
       inconsistently across renderers, which silently un-aligns a table. -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">

    <text x="30" y="80"><tspan fill="#58A6FF" font-weight="700">$ </tspan><tspan fill="#E6EDF3">docker compose ps</tspan></text>

    <g fill="#6E7F94" font-size="12">
      <text x="50" y="108">NAME</text>
      <text x="200" y="108">IMAGE</text>
      <text x="330" y="108">STATUS</text>
      <text x="460" y="108">PORTS</text>
    </g>

    <g fill="#C9D8EA">
      <g>
        <circle cx="36" cy="128" r="4" fill="#3FB950"/>
        <text x="50" y="132">distkv-node1-1</text><text x="200" y="132">distkv-node1</text><text x="330" y="132">Up 5 minutes</text><text x="460" y="132" fill="#9FB3C8">0.0.0.0:7071-&gt;7070/tcp</text>
      </g>
      <g>
        <circle cx="36" cy="152" r="4" fill="#3FB950"/>
        <text x="50" y="156">distkv-node2-1</text><text x="200" y="156">distkv-node2</text><text x="330" y="156">Up 5 minutes</text><text x="460" y="156" fill="#9FB3C8">0.0.0.0:7072-&gt;7070/tcp</text>
      </g>
      <g>
        <circle cx="36" cy="176" r="4" fill="#3FB950"/>
        <text x="50" y="180">distkv-node3-1</text><text x="200" y="180">distkv-node3</text><text x="330" y="180">Up 5 minutes</text><text x="460" y="180" fill="#9FB3C8">0.0.0.0:7073-&gt;7070/tcp</text>
      </g>
      <g>
        <circle cx="36" cy="200" r="4" fill="#3FB950"/>
        <text x="50" y="204">distkv-node4-1</text><text x="200" y="204">distkv-node4</text><text x="330" y="204">Up 5 minutes</text><text x="460" y="204" fill="#9FB3C8">0.0.0.0:7074-&gt;7070/tcp</text>
      </g>
      <g>
        <circle cx="36" cy="224" r="4" fill="#3FB950"/>
        <text x="50" y="228">distkv-node5-1</text><text x="200" y="228">distkv-node5</text><text x="330" y="228">Up 5 minutes</text><text x="460" y="228" fill="#9FB3C8">0.0.0.0:7075-&gt;7070/tcp</text>
      </g>
    </g>

    <text x="30" y="264" fill="#6E7F94" font-size="12.5"># node2 holds the lease. kill it, and one more.</text>

    <text x="30" y="292"><tspan fill="#58A6FF" font-weight="700">$ </tspan><tspan fill="#E6EDF3">docker compose stop node2 node1</tspan></text>

    <g fill="#6E7F94" font-size="12">
      <text x="50" y="320">NAME</text>
      <text x="200" y="320">STATUS</text>
    </g>
    <g fill="#C9D8EA">
      <g>
        <circle cx="36" cy="340" r="4" fill="#3FB950"/>
        <text x="50" y="344">distkv-node3-1</text><text x="200" y="344">Up 6 minutes</text>
      </g>
      <g>
        <circle cx="36" cy="364" r="4" fill="#3FB950"/>
        <text x="50" y="368">distkv-node4-1</text><text x="200" y="368">Up 6 minutes</text>
      </g>
      <g>
        <circle cx="36" cy="388" r="4" fill="#3FB950"/>
        <text x="50" y="392">distkv-node5-1</text><text x="200" y="392">Up 6 minutes</text>
      </g>
    </g>

    <text x="30" y="424"><tspan fill="#58A6FF" font-weight="700">$ </tspan><tspan fill="#E6EDF3">distkv-cli -endpoints node3:7070 get city</tspan></text>
    <text x="30" y="448"><tspan fill="#FFD166" font-weight="700">kathmandu-nepal</tspan><tspan fill="#3FB950">   ← node4 took the lease; the value never moved</tspan></text>
  </g>
</svg>
